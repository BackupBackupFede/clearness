org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Target Minecraft version = THE switch.
# Per-version values live in MATRIX (build.gradle). Build another line with:
#   ./gradlew build -Pminecraft_version=1.21.1
# ---------------------------------------------------------------------------
minecraft_version=26.3

# --- Gradle plugin versions -------------------------------------------------
# ONE Loom covers both the obfuscated (1.21.x) and de-obfuscated (26.x) eras.
# What changes per era is the plugin ID, not the version — see fabric/build.gradle.
loom_version=1.16.3
# ModDevGradle is per-Minecraft-line in practice: 2.0.142 cannot recompile 26.3
# (contents() in <anonymous HolderSet$1> ... weaker access privileges). When a NEW line fails
# inside NeoForm rather than in your code, bump this before suspecting anything else.
moddev_version=2.0.147

# --- Fabric API: OFF by default -------------------------------------------
# Needed only for assets (fabric-resource-loader-v0) or a static registry
# (fabric-registry-sync-v0). Leave false for a Tier A mod: on 1.21.1 with Mojang
# mappings, Fabric API's own resource-loader mixin CRASHES a Fabric server at the
# first chunk, and the build stays green. Turn it on only when the mod needs it,
# and run a 1.21.1 server before believing it works.
use_fabric_api=false

# --- Mixin toolchain (both loaders bundle these; shared across MC versions) --
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.4

# --- Mod identity (expanded into fabric.mod.json / neoforge.mods.toml) ------
mod_id=clearness
mod_name=Clearness
# GitHub repository name. Kept separate from mod_id on purpose: mod_id is frozen by the first
# release (registry ids, packages, asset paths) while the repo follows the public name.
mod_repo=clearness
mod_author=AceOverDeuce
mod_version=3.0.0
mod_license=MIT
mod_group=net.emeraude
