name: Release

# Builds every line of MATRIX (read from build.gradle), then publishes ALL jars
# in ONE pass to Modrinth + CurseForge + GitHub Releases.
#
# Why publishing is its own job: mc-publish must see every jar at once, otherwise
# each matrix leg creates its own GitHub Release and overwrites the previous one.
#
# DORMANT until configured (a platform is skipped when its token is absent):
#   Variables: MODRINTH_ID, CURSEFORGE_ID
#   Secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
#
# Release flow: bump mod_version in gradle.properties, then
#   git tag v0.1.0 && git push --tags
#
# Action majors were bumped away from the Node 20 deprecation. build.yml exercises checkout /
# setup-java / setup-gradle on every push, so those are proven early; upload-artifact and
# download-artifact only ever run here, so WATCH the first tag of a new mod.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Read MATRIX keys from build.gradle
        run: |
          list=$(grep -oP '^\s*"\K[0-9][^"]*(?="\s*:\s*\[)' build.gradle | sed 's/.*/"&"/' | paste -sd, -)
          if [ -z "$list" ]; then
            echo "::error file=build.gradle::No versions found in MATRIX — check its formatting."
            exit 1
          fi
          echo "list=[$list]" >> "$GITHUB_OUTPUT"
          echo "Will release: [$list]"

  build:
    needs: versions
    strategy:
      fail-fast: true           # never publish a partial matrix
      matrix:
        minecraft: ${{ fromJSON(needs.versions.outputs.list) }}
    runs-on: ubuntu-latest
    name: build ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
          # upload-artifact globs with @actions/glob, NOT bash. Extglob such as
          # !(*-@(sources|javadoc)).jar silently matches nothing; exclusions are
          # separate lines starting with '!'.
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !neoforge/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            !neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error

  # ONE mc-publish call per (Minecraft version x loader): one jar, one loader,
  # one version.
  #
  # Publishing both loaders' jars under a single version is what Modrinth
  # rejects, and it rejects it late - at tag time, with
  #   400 invalid_input: No fabric.mod.json present for Fabric file
  # A Modrinth version has ONE primary file, and every loader the version
  # declares has to be satisfied by that file. A Fabric jar and a NeoForge jar
  # cannot share one. Sodium and JEI both publish one loader per version for
  # exactly this reason; the multi-loader versions you see elsewhere are a
  # single jar that two loaders can read (forge + neoforge), never two jars.
  #
  # CurseForge is laxer and accepted the old shape, which is precisely how this
  # stayed invisible until one platform had already been written to.
  publish:
    needs: [ versions, build ]
    strategy:
      max-parallel: 1
      matrix:
        minecraft: ${{ fromJSON(needs.versions.outputs.list) }}
        loader: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    name: publish ${{ matrix.minecraft }} ${{ matrix.loader }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
          path: dist

      # Recursive: upload-artifact roots each artifact at the least common
      # ancestor of its paths, so jars arrive under dist/<loader>/build/libs/,
      # never flat in dist/.
      - name: List what will be published for ${{ matrix.minecraft }} ${{ matrix.loader }}
        run: |
          find dist/${{ matrix.loader }} -name '*.jar' -print > picked.txt
          cat picked.txt
          n=$(wc -l < picked.txt)
          # Exactly one jar must match, or "primary file" stops meaning anything.
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly 1 ${{ matrix.loader }} jar, found $n"
            exit 1
          fi

      # Each Minecraft version gets its own entry, so each needs its own version
      # number: publishing "1.0.0" twice on one project is a collision. The
      # "1.0.0+1.21.1" shape is the usual convention for Minecraft mods.
      - id: ver
        name: Derive the version number for this line
        run: echo "number=${GITHUB_REF_NAME#v}+${{ matrix.minecraft }}-${{ matrix.loader }}" >> "$GITHUB_OUTPUT"

      # A half-configured platform is the failure this guards against: mc-publish
      # skips a platform whose token is missing and the job still goes green, so
      # the release looks fine and one store is simply empty. Nothing configured
      # at all stays dormant, as intended; an ID without its token is an error.
      - name: Refuse to publish a half-configured platform
        env:
          MR_ID: ${{ vars.MODRINTH_ID }}
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CF_ID: ${{ vars.CURSEFORGE_ID }}
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          fail=0
          for p in MR CF; do
            eval "id=\$${p}_ID; token=\$${p}_TOKEN"
            if [ -n "$id" ] && [ -z "$token" ]; then
              echo "::error::${p}_ID is set but ${p}_TOKEN is not - this platform would be skipped in silence."
              fail=1
            elif [ -z "$id" ] && [ -n "$token" ]; then
              echo "::error::${p}_TOKEN is set but ${p}_ID is not."
              fail=1
            elif [ -n "$id" ]; then
              echo "$p: configured."
            else
              echo "::warning::$p is not configured - skipping that platform."
            fi
          done
          exit $fail

      # loaders and game-versions are declared, never inferred - one loader and
      # one Minecraft version per call, matching the single jar handed over.
      #
      # No github-token on purpose: the GitHub release is created once, by the
      # job below, or each matrix leg would overwrite the previous one.
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/${{ matrix.loader }}/build/libs/*.jar
          version: ${{ steps.ver.outputs.number }}
          name: ${{ steps.ver.outputs.number }}
          version-type: release
          game-versions: ${{ matrix.minecraft }}
          loaders: ${{ matrix.loader }}

  # One release carrying every jar, via the runner's preinstalled gh CLI rather
  # than another third-party action.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: jars-*
          merge-multiple: true
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          find dist -name '*.jar' -print | sort > jars.txt
          if [ ! -s jars.txt ]; then
            echo "::error::No jars found to attach to the release."
            exit 1
          fi
          cat jars.txt
          xargs -a jars.txt gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
